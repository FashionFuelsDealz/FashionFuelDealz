<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion Fuel - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <div class="w-64 bg-orange-600 text-white p-4">
            <h1 class="text-2xl font-bold mb-8">Fashion Fuel</h1>
            <ul>
                <li><button onclick="showTab('dashboard')" class="w-full text-left py-2 px-4 hover:bg-orange-700 rounded mb-1"><i class="fas fa-chart-line mr-2"></i>Dashboard</button></li>
                <li><button onclick="showTab('products')" class="w-full text-left py-2 px-4 hover:bg-orange-700 rounded mb-1"><i class="fas fa-box mr-2"></i>Products</button></li>
                <li><button onclick="showTab('orders')" class="w-full text-left py-2 px-4 hover:bg-orange-700 rounded mb-1"><i class="fas fa-shopping-bag mr-2"></i>Orders</button></li>
            </ul>
        </div>

        <!-- Main Content -->
        <div class="flex-1 p-8 overflow-y-auto">
            <!-- Dashboard -->
            <div id="dashboard" class="tab-content">
                <h2 class="text-3xl font-bold mb-6">Dashboard</h2>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                    <div class="bg-white p-6 rounded-lg shadow">
                        <h3 class="text-gray-500">All Products</h3>
                        <p id="totalProducts" class="text-3xl font-bold text-orange-600">0</p>
                    </div>
                    <div class="bg-white p-6 rounded-lg shadow">
                        <h3 class="text-gray-500">Total Orders</h3>
                        <p id="totalOrders" class="text-3xl font-bold text-orange-600">0</p>
                    </div>
                    <div class="bg-white p-6 rounded-lg shadow">
                        <h3 class="text-gray-500">Total Users</h3>
                        <p id="totalUsers" class="text-3xl font-bold text-orange-600">0</p>
                    </div>
                    <div class="bg-white p-6 rounded-lg shadow">
                        <h3 class="text-gray-500">Messages</h3>
                        <p id="totalMessages" class="text-3xl font-bold text-orange-600">0</p>
                    </div>
                </div>

                <h3 class="text-xl font-bold mb-4">Recent Messages from Contact Us</h3>
                <div id="messagesList" class="bg-white rounded-lg shadow p-4"></div>
            </div>

            <!-- Products -->
            <div id="products" class="tab-content hidden">
                <h2 class="text-3xl font-bold mb-6">Products</h2>
                <div class="bg-white p-6 rounded-lg shadow mb-6">
                    <h3 class="text-xl font-bold mb-4">Add New Product</h3>
                    <input id="pName" placeholder="Product Name" class="w-full border p-2 mb-3 rounded">
                    <input id="pPrice" placeholder="Price" type="number" class="w-full border p-2 mb-3 rounded">
                    <textarea id="pDesc" placeholder="Description" class="w-full border p-2 mb-3 rounded"></textarea>
                    <input id="pImg1" placeholder="Image URL 1 - Main Image" class="w-full border p-2 mb-2 rounded">
                    <input id="pImg2" placeholder="Image URL 2" class="w-full border p-2 mb-2 rounded">
                    <input id="pImg3" placeholder="Image URL 3" class="w-full border p-2 mb-3 rounded">
                    <button onclick="addProduct()" class="bg-orange-500 text-white px-6 py-2 rounded font-bold hover:bg-orange-600">Add Product</button>
                </div>
                <div id="productList" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
            </div>

            <!-- Orders -->
            <div id="orders" class="tab-content hidden">
                <h2 class="text-3xl font-bold mb-6">Order Details</h2>
                <div id="orderList" class="space-y-4"></div>
            </div>
        </div>
    </div>

<script>
// Data
let products = JSON.parse(localStorage.getItem('products')) || [];
let orders = JSON.parse(localStorage.getItem('orders')) || [];
let messages = JSON.parse(localStorage.getItem('messages')) || [];

function showTab(tab) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
    document.getElementById(tab).classList.remove('hidden');
    if(tab === 'dashboard') loadDashboard();
    if(tab === 'products') loadProducts();
    if(tab === 'orders') loadOrders();
}

function addProduct() {
    const images = [
        document.getElementById('pImg1').value,
        document.getElementById('pImg2').value,
        document.getElementById('pImg3').value
    ].filter(img => img);

    if(!document.getElementById('pName').value ||!document.getElementById('pPrice').value || images.length === 0) {
        alert('Please fill Name, Price and at least 1 Image URL');
        return;
    }

    const product = {
        id: Date.now(),
        name: document.getElementById('pName').value,
        price: document.getElementById('pPrice').value,
        description: document.getElementById('pDesc').value,
        images: images,
        image: images[0]
    };
    products.push(product);
    localStorage.setItem('products', JSON.stringify(products));
    alert('Product Added!');

    // Clear fields
    document.getElementById('pName').value = '';
    document.getElementById('pPrice').value = '';
    document.getElementById('pDesc').value = '';
    document.getElementById('pImg1').value = '';
    document.getElementById('pImg2').value = '';
    document.getElementById('pImg3').value = '';

    loadProducts();
    loadDashboard();
}

function deleteProduct(index) {
    if(confirm('Are you sure you want to delete this product?')) {
        products.splice(index, 1);
        localStorage.setItem('products', JSON.stringify(products));
        loadProducts();
        loadDashboard();
    }
}

function loadDashboard() {
    document.getElementById('totalProducts').innerText = products.length;
    document.getElementById('totalOrders').innerText = orders.length;
    document.getElementById('totalUsers').innerText = new Set(orders.map(o => o.email)).size;
    document.getElementById('totalMessages').innerText = messages.length;

    let msgHtml = '';
    if(messages.length === 0) {
        msgHtml = '<p class="text-gray-500 text-center py-4">No messages yet</p>';
    } else {
        messages.slice().reverse().forEach(m => {
            msgHtml += `<div class="border-b py-3">
                <p class="font-bold">${m.name} <span class="text-xs text-gray-500 font-normal">(${m.email})</span></p>
                <p class="text-gray-700">${m.message}</p>
                <p class="text-xs text-gray-400 mt-1">${m.date}</p>
            </div>`;
        });
    }
    document.getElementById('messagesList').innerHTML = msgHtml;
}

function loadProducts() {
    let html = '';
    if(products.length === 0) {
        html = '<p class="col-span-3 text-center text-gray-500 py-8">No products added yet</p>';
    } else {
        products.forEach((p, index) => {
            html += `<div class="bg-white p-4 rounded shadow relative">
                <button onclick="deleteProduct(${index})" class="absolute top-2 right-2 bg-red-500 text-white w-8 h-8 rounded-full hover:bg-red-600"><i class="fas fa-trash text-xs"></i></button>
                <img src="${p.image}" class="h-40 w-full object-cover mb-2 rounded">
                <h3 class="font-bold">${p.name}</h3>
                <p class="text-orange-600 font-bold">₹${p.price}</p>
                <p class="text-xs text-gray-500 mt-1">${p.images.length} Images</p>
            </div>`;
        });
    }
    document.getElementById('productList').innerHTML = html;
}

function loadOrders() {
    let html = '';
    if(orders.length === 0) {
        html = '<p class="text-center text-gray-500 py-8">No orders yet</p>';
    } else {
        orders.slice().reverse().forEach((o, index) => {
            html += `<div class="bg-white p-6 rounded shadow">
                <div class="flex justify-between items-start mb-3">
                    <h3 class="font-bold text-lg">Order #${orders.length - index}</h3>
                    <span class="bg-green-100 text-green-800 text-xs px-3 py-1 rounded-full">${o.payment}</span>
                </div>
                <div class="grid md:grid-cols-2 gap-4 text-sm">
                    <div>
                        <p><b>Customer:</b> ${o.name}</p>
                        <p><b>Mobile:</b> ${o.phone}</p>
                        <p><b>Email:</b> ${o.email}</p>
                        <p><b>Size:</b> ${o.size} | <b>Colour:</b> ${o.colour}</p>
                    </div>
                    <div>
                        <p><b>Address:</b> ${o.address}</p>
                        <p><b>Landmark:</b> ${o.landmark}</p>
                        <p><b>Pincode:</b> ${o.pincode}</p>
                        <p><b>Date:</b> ${o.date}</p>
                    </div>
                </div>
                <div class="mt-3 pt-3 border-t">
                    <p class="font-bold mb-1">Products:</p>
                    <p class="text-gray-700">${o.items.map(i => `${i.name} x${i.qty}`).join(', ')}</p>
                    <p class="text-xl font-bold text-orange-600 mt-2">Total: ₹${o.total}</p>
                </div>
            </div>`;
        });
    }
    document.getElementById('orderList').innerHTML = html;
}

// Init
showTab('dashboard');
</script>
</body>
</html>
