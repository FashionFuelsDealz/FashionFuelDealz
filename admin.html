<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion Fuel - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body{font-family:Poppins,sans-serif}
 .tab-content{display:none}
 .tab-content.active{display:block}
    </style>
</head>
<body class="bg-gray-50">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <div class="w-64 bg-orange-600 text-white p-4">
            <h1 class="text-2xl font-bold mb-8">Fashion Fuel</h1>
            <ul>
                <li><button onclick="showTab('dashboard')" class="w-full text-left py-2 px-4 hover:bg-orange-700 rounded mb-1"><i class="fas fa-chart-line mr-2"></i>Dashboard</button></li>
                <li><button onclick="showTab('products')" class="w-full text-left py-2 px-4 hover:bg-orange-700 rounded mb-1"><i class="fas fa-box mr-2"></i>Products</button></li>
                <li><button onclick="showTab('orders')" class="w-full text-left py-2 px-4 hover:bg-orange-700 rounded mb-1"><i class="fas fa-shopping-bag mr-2"></i>Orders</button></li>
                <li><button onclick="showTab('messages')" class="w-full text-left py-2 px-4 hover:bg-orange-700 rounded mb-1"><i class="fas fa-envelope mr-2"></i>Messages</button></li>
            </ul>
        </div>

        <!-- Main Content -->
        <div class="flex-1 p-8 overflow-y-auto">
            <!-- Dashboard -->
            <div id="dashboard" class="tab-content active">
                <h2 class="text-3xl font-bold mb-6 text-orange-600">Dashboard</h2>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                    <div class="bg-white p-6 rounded-lg shadow border border-orange-100">
                        <h3 class="text-gray-500">All Products</h3>
                        <p id="totalProducts" class="text-3xl font-bold text-orange-600">0</p>
                    </div>
                    <div class="bg-white p-6 rounded-lg shadow border border-orange-100">
                        <h3 class="text-gray-500">Total Orders</h3>
                        <p id="totalOrders" class="text-3xl font-bold text-orange-600">0</p>
                    </div>
                    <div class="bg-white p-6 rounded-lg shadow border border-orange-100">
                        <h3 class="text-gray-500">Total Users</h3>
                        <p id="totalUsers" class="text-3xl font-bold text-orange-600">0</p>
                    </div>
                    <div class="bg-white p-6 rounded-lg shadow border border-orange-100">
                        <h3 class="text-gray-500">Messages</h3>
                        <p id="totalMessages" class="text-3xl font-bold text-orange-600">0</p>
                    </div>
                </div>
            </div>

            <!-- Products -->
            <div id="products" class="tab-content">
                <h2 class="text-3xl font-bold mb-6 text-orange-600">Products</h2>
                <div class="bg-white p-6 rounded-lg shadow mb-6 border border-orange-100">
                    <h3 class="text-xl font-bold mb-4">Add New Product</h3>
                    <input id="pName" placeholder="Product Name" class="w-full border-2 border-orange-200 p-2 mb-3 rounded focus:border-orange-500">
                    <input id="pPrice" placeholder="Price" type="number" class="w-full border-2 border-orange-200 p-2 mb-3 rounded focus:border-orange-500">
                    <select id="pCategory" class="w-full border-2 border-orange-200 p-2 mb-3 rounded focus:border-orange-500">
                        <option value="">Select Category</option>
                        <option>Shirts</option><option>T-Shirts</option><option>Jeans</option>
                        <option>Shoes</option><option>Watches</option><option>Accessories</option>
                    </select>
                    <textarea id="pDesc" placeholder="Description" class="w-full border-2 border-orange-200 p-2 mb-3 rounded focus:border-orange-500"></textarea>
                    
                    <!-- Dynamic Images Section -->
                    <div class="mb-3">
                        <label class="font-bold mb-2 block">Product Images <span class="text-sm font-normal text-gray-500">(Min 1, Max 15)</span></label>
                        <div id="imageInputs" class="space-y-2">
                            <input type="url" placeholder="Image URL 1 - Main Image" class="w-full border-2 border-orange-200 p-2 rounded focus:border-orange-500 image-input">
                        </div>
                        <button onclick="addImageInput()" class="mt-2 bg-orange-100 text-orange-600 px-4 py-1 rounded text-sm hover:bg-orange-200"><i class="fas fa-plus mr-1"></i>Add More Image</button>
                    </div>

                    <input id="pSizes" placeholder="Sizes: S,M,L,XL (comma separated)" value="S,M,L,XL,XXL" class="w-full border-2 border-orange-200 p-2 mb-3 rounded focus:border-orange-500">
                    <input id="pColors" placeholder="Colors: Black,White,Red (comma separated)" value="Black,White,Red,Blue" class="w-full border-2 border-orange-200 p-2 mb-3 rounded focus:border-orange-500">
                    <label class="flex items-center gap-2 mb-3"><input type="checkbox" id="pFeatured" class="accent-orange-500"> <span>Featured Product</span></label>
                    <button onclick="addProduct()" class="bg-orange-500 text-white px-6 py-2 rounded font-bold hover:bg-orange-600">Add Product</button>
                </div>
                <div id="productList" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
            </div>

            <!-- Orders -->
            <div id="orders" class="tab-content">
                <h2 class="text-3xl font-bold mb-6 text-orange-600">Order Details</h2>
                <div id="orderList" class="space-y-4"></div>
            </div>

            <!-- Messages -->
            <div id="messages" class="tab-content">
                <h2 class="text-3xl font-bold mb-6 text-orange-600">Contact Messages</h2>
                <div id="messagesList" class="space-y-4"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, push, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const FIREBASE_CONFIG = {apiKey:"AIzaSyDnN6Vqh6yNdWM6NVg_JFbMTrj37jheK9I",authDomain:"fashionfuel-7e841.firebaseapp.com",databaseURL:"https://fashionfuel-7e841-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"fashionfuel-7e841",storageBucket:"fashionfuel-7e841.firebasestorage.app",messagingSenderId:"457153779306",appId:"1:457153779306:web:7f8c6f6129da5f9e8bdc13",measurementId:"G-WL5KVK1KJX"};
        const app = initializeApp(FIREBASE_CONFIG);
        const db = getDatabase(app);

        let products = {}, orders = {}, messages = {}, users = {};

        onValue(ref(db, 'products'), s => { products = s.val() || {}; loadProducts(); loadDashboard(); });
        onValue(ref(db, 'orders'), s => { orders = s.val() || {}; loadOrders(); loadDashboard(); });
        onValue(ref(db, 'messages'), s => { messages = s.val() || {}; loadMessages(); loadDashboard(); });
        onValue(ref(db, 'users'), s => { users = s.val() || {}; loadDashboard(); });

        window.showTab = (tab) => {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
        };

        window.addImageInput = () => {
            const imageInputs = document.getElementById('imageInputs');
            const count = imageInputs.querySelectorAll('.image-input').length;
            if(count >= 15) {
                alert('Maximum 15 images allowed');
                return;
            }
            const input = document.createElement('input');
            input.type = 'url';
            input.placeholder = `Image URL ${count + 1}`;
            input.className = 'w-full border-2 border-orange-200 p-2 rounded focus:border-orange-500 image-input';
            imageInputs.appendChild(input);
        };

        window.addProduct = async () => {
            const imageInputs = document.querySelectorAll('.image-input');
            const images = Array.from(imageInputs).map(input => input.value).filter(img => img);

            if(!document.getElementById('pName').value ||!document.getElementById('pPrice').value ||!document.getElementById('pCategory').value || images.length === 0) {
                alert('Please fill Name, Price, Category and at least 1 Image URL');
                return;
            }

            if(images.length > 15) {
                alert('Maximum 15 images allowed');
                return;
            }

            const product = {
                name: document.getElementById('pName').value,
                price: parseFloat(document.getElementById('pPrice').value),
                category: document.getElementById('pCategory').value,
                description: document.getElementById('pDesc').value,
                images: images,
                image: images[0],
                sizes: document.getElementById('pSizes').value.split(',').map(s => s.trim()),
                colors: document.getElementById('pColors').value.split(',').map(c => c.trim()),
                featured: document.getElementById('pFeatured').checked,
                rating: 0,
                views: 0,
                timestamp: Date.now()
            };

            await push(ref(db, 'products'), product);
            alert('Product Added!');
            
            // Reset form
            document.getElementById('pName').value = '';
            document.getElementById('pPrice').value = '';
            document.getElementById('pCategory').value = '';
            document.getElementById('pDesc').value = '';
            document.getElementById('pFeatured').checked = false;
            document.getElementById('imageInputs').innerHTML = '<input type="url" placeholder="Image URL 1 - Main Image" class="w-full border-2 border-orange-200 p-2 rounded focus:border-orange-500 image-input">';
        };

        window.deleteProduct = async (key) => {
            if(confirm('Are you sure you want to delete this product?')) {
                await remove(ref(db, 'products/' + key));
            }
        };

        function loadDashboard() {
            document.getElementById('totalProducts').innerText = Object.keys(products).length;
            document.getElementById('totalOrders').innerText = Object.keys(orders).length;
            document.getElementById('totalUsers').innerText = Object.keys(users).length;
            document.getElementById('totalMessages').innerText = Object.keys(messages).length;
        }

        function loadProducts() {
            let html = '';
            if(Object.keys(products).length === 0) {
                html = '<p class="col-span-3 text-center text-gray-500 py-8">No products added yet</p>';
            } else {
                Object.entries(products).forEach(([key, p]) => {
                    html += `<div class="bg-white p-4 rounded shadow relative border border-orange-100">
                        <button onclick="deleteProduct('${key}')" class="absolute top-2 right-2 bg-red-500 text-white w-8 h-8 rounded-full hover:bg-red-600"><i class="fas fa-trash text-xs"></i></button>
                        <img src="${p.image}" class="h-40 w-full object-cover mb-2 rounded">
                        <h3 class="font-bold">${p.name}</h3>
                        <p class="text-orange-600 font-bold">₹${p.price}</p>
                        <p class="text-xs text-gray-500">${p.category} | ${p.images.length} Images | 👁️ ${p.views || 0}</p>
                    </div>`;
                });
            }
            document.getElementById('productList').innerHTML = html;
        }

        function loadOrders() {
            let html = '';
            if(Object.keys(orders).length === 0) {
                html = '<p class="text-center text-gray-500 py-8">No orders yet</p>';
            } else {
                Object.entries(orders).reverse().forEach(([key, o]) => {
                    html += `<div class="bg-white p-6 rounded shadow border border-orange-100">
                        <div class="flex justify-between items-start mb-3">
                            <h3 class="font-bold text-lg">Order #${key.slice(-6)}</h3>
                            <span class="bg-green-100 text-green-800 text-xs px-3 py-1 rounded-full">${o.paymentMethod}</span>
                        </div>
                        <div class="grid md:grid-cols-2 gap-4 text-sm">
                            <div>
                                <p><b>Customer:</b> ${o.name}</p>
                                <p><b>Mobile:</b> ${o.phone}</p>
                                <p><b>Email:</b> ${o.email}</p>
                            </div>
                            <div>
                                <p><b>Address:</b> ${o.address}, ${o.city}</p>
                                <p><b>Landmark:</b> ${o.landmark}</p>
                                <p><b>Pincode:</b> ${o.pincode}</p>
                                <p><b>Date:</b> ${new Date(o.timestamp).toLocaleString()}</p>
                            </div>
                        </div>
                        <div class="mt-3 pt-3 border-t">
                            <p class="font-bold mb-1">Products:</p>
                            ${o.items.map(i => `<p class="text-gray-700 text-sm">${i.name} - Size: ${i.size} | Color: ${i.color} x${i.qty} = ₹${i.price * i.qty}</p>`).join('')}
                            <p class="text-xl font-bold text-orange-600 mt-2">Total: ₹${o.total}</p>
                        </div>
                    </div>`;
                });
            }
            document.getElementById('orderList').innerHTML = html;
        }

        function loadMessages() {
            let html = '';
            if(Object.keys(messages).length === 0) {
                html = '<p class="text-center text-gray-500 py-8">No messages yet</p>';
            } else {
                Object.entries(messages).reverse().forEach(([key, m]) => {
                    html += `<div class="bg-white p-4 rounded shadow border border-orange-100">
                        <p class="font-bold">${m.name} <span class="text-xs text-gray-500 font-normal">(${m.email})</span></p>
                        <p class="text-gray-700 my-2">${m.message}</p>
                        <p class="text-xs text-gray-400">${new Date(m.timestamp).toLocaleString()}</p>
                    </div>`;
                });
            }
            document.getElementById('messagesList').innerHTML = html;
        }
    </script>
</body>
</html>
