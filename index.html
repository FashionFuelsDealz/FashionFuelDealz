<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion Fuel - Trendy Fashion Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body{font-family:Poppins,sans-serif}
     .product-card{transition:transform 0.2s}
     .product-card:hover{transform:translateY(-5px)}
     .size-btn.selected{background:#2563eb;color:white;border-color:#2563eb}
     .modal{display:none}
     .modal.active{display:flex}
    </style>
</head>
<body class="bg-gray-50">
    <header class="bg-white shadow-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <img src="https://i.ibb.co/Z6KWsXtc/IMG-20260608-121833.jpg" alt="Fashion Fuel" class="h-10 md:h-12">
            <div class="flex items-center gap-4">
                <button onclick="openCart()" class="relative">
                    🛒
                    <span id="cart-count" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center">0</span>
                </button>
                <a href="#contact" class="text-sm hover:text-blue-600">Contact</a>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <div class="mb-6 flex gap-2 overflow-x-auto pb-2">
            <button onclick="filterCategory('All')" class="cat-btn px-4 py-2 bg-blue-600 text-white rounded-lg whitespace-nowrap">All</button>
            <button onclick="filterCategory('Shirts')" class="cat-btn px-4 py-2 bg-gray-200 rounded-lg whitespace-nowrap">Shirts</button>
            <button onclick="filterCategory('T-Shirts')" class="cat-btn px-4 py-2 bg-gray-200 rounded-lg whitespace-nowrap">T-Shirts</button>
            <button onclick="filterCategory('Jeans')" class="cat-btn px-4 py-2 bg-gray-200 rounded-lg whitespace-nowrap">Jeans</button>
            <button onclick="filterCategory('Shoes')" class="cat-btn px-4 py-2 bg-gray-200 rounded-lg whitespace-nowrap">Shoes</button>
            <button onclick="filterCategory('Watches')" class="cat-btn px-4 py-2 bg-gray-200 rounded-lg whitespace-nowrap">Watches</button>
            <button onclick="filterCategory('Accessories')" class="cat-btn px-4 py-2 bg-gray-200 rounded-lg whitespace-nowrap">Accessories</button>
        </div>

        <div id="product-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
    </main>

    <section id="contact" class="bg-white py-12 mt-12">
        <div class="max-w-2xl mx-auto px-4">
            <h2 class="text-2xl font-bold text-center mb-6">Contact Us</h2>
            <form id="contact-form" class="space-y-4">
                <input type="text" id="c-name" placeholder="Your Name" class="w-full p-3 border rounded-lg" required>
                <input type="email" id="c-email" placeholder="Your Email" class="w-full p-3 border rounded-lg" required>
                <textarea id="c-message" placeholder="Your Message" class="w-full p-3 border rounded-lg" rows="4" required></textarea>
                <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold">Send Message</button>
            </form>
            <div class="text-center mt-6">
                <a href="https://wa.me/919113358739" target="_blank" class="inline-block bg-green-500 text-white px-6 py-3 rounded-lg font-semibold">💬 Chat on WhatsApp</a>
            </div>
        </div>
    </section>

    <!-- Product Modal -->
    <div id="product-modal" class="modal fixed inset-0 bg-black bg-opacity-50 z-50 items-center justify-center p-4">
        <div class="bg-white rounded-xl max-w-2xl w-full max-h-screen overflow-y-auto">
            <div class="p-6">
                <div class="flex justify-between items-start mb-4">
                    <h3 id="modal-name" class="text-2xl font-bold"></h3>
                    <button onclick="closeModal()" class="text-2xl">×</button>
                </div>
                <img id="modal-img" class="w-full h-64 object-cover rounded-lg mb-4">
                <p id="modal-desc" class="text-gray-600 mb-4"></p>
                <p class="text-2xl font-bold mb-4">₹<span id="modal-price"></span></p>
                <div class="mb-4">
                    <p class="font-semibold mb-2">Select Size:</p>
                    <div id="modal-sizes" class="flex gap-2 flex-wrap"></div>
                </div>
                <button onclick="addToCartFromModal()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold">Add to Cart</button>
            </div>
        </div>
    </div>

    <!-- Cart Modal -->
    <div id="cart-modal" class="modal fixed inset-0 bg-black bg-opacity-50 z-50 items-center justify-center p-4">
        <div class="bg-white rounded-xl max-w-2xl w-full max-h-screen overflow-y-auto">
            <div class="p-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-2xl font-bold">Your Cart</h3>
                    <button onclick="closeCart()" class="text-2xl">×</button>
                </div>
                <div id="cart-items" class="space-y-3 mb-4"></div>
                <div class="border-t pt-4">
                    <div class="flex justify-between text-xl font-bold mb-4">
                        <span>Total:</span><span>₹<span id="cart-total">0</span></span>
                    </div>
                    <button onclick="openCheckout()" class="w-full bg-green-600 text-white py-3 rounded-lg font-semibold">Proceed to Checkout</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Checkout Modal -->
    <div id="checkout-modal" class="modal fixed inset-0 bg-black bg-opacity-50 z-50 items-center justify-center p-4">
        <div class="bg-white rounded-xl max-w-2xl w-full max-h-screen overflow-y-auto">
            <div class="p-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-2xl font-bold">Checkout</h3>
                    <button onclick="closeCheckout()" class="text-2xl">×</button>
                </div>
                <form id="checkout-form" class="space-y-4">
                    <input type="text" id="co-name" placeholder="Full Name" class="w-full p-3 border rounded-lg" required>
                    <input type="tel" id="co-phone" placeholder="Phone Number" class="w-full p-3 border rounded-lg" required>
                    <textarea id="co-address" placeholder="Full Address" class="w-full p-3 border rounded-lg" rows="2" required></textarea>
                    <div class="grid grid-cols-2 gap-4">
                        <input type="text" id="co-city" placeholder="City" class="p-3 border rounded-lg" required>
                        <input type="text" id="co-pincode" placeholder="Pincode" class="p-3 border rounded-lg" required>
                    </div>
                    <div class="border rounded-lg p-4">
                        <p class="font-semibold mb-3">Payment Method:</p>
                        <label class="flex items-center gap-2 mb-2"><input type="radio" name="payment" value="COD" checked onchange="toggleUPI()"> <span>Cash on Delivery</span></label>
                        <label class="flex items-center gap-2"><input type="radio" name="payment" value="UPI" onchange="toggleUPI()"> <span>UPI Payment</span></label>
                        <div id="upi-section" class="hidden mt-4 text-center">
                            <p class="text-sm mb-2">Scan QR or Pay to UPI ID:</p>
                            <p class="font-bold text-lg mb-2">9113358739@fam</p>
                            <div id="qrcode" class="flex justify-center mb-2"></div>
                            <p class="text-xs text-gray-600">Amount: ₹<span id="upi-amount"></span></p>
                            <p class="text-xs text-red-600 mt-2">⚠️ After payment, click Place Order</p>
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold">Place Order</button>
                </form>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, push, set, onValue, update, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const FIREBASE_CONFIG = {apiKey:"AIzaSyDnN6Vqh6yNdWM6NVg_JFbMTrj37jheK9I",authDomain:"fashionfuel-7e841.firebaseapp.com",databaseURL:"https://fashionfuel-7e841-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"fashionfuel-7e841",storageBucket:"fashionfuel-7e841.firebasestorage.app",messagingSenderId:"457153779306",appId:"1:457153779306:web:7f8c6f6129da5f9e8bdc13",measurementId:"G-WL5KVK1KJX"};
        const UPI_ID = "9113358739@fam";
        const WHATSAPP = "9113358739";

        const app = initializeApp(FIREBASE_CONFIG);
        const db = getDatabase(app);

        let allProducts = {}, cart = [], currentProduct = null, currentCategory = 'All';

        // Track Visitor
        const visitorId = localStorage.getItem('visitorId') || Date.now();
        localStorage.setItem('visitorId', visitorId);
        set(ref(db, 'visitors/' + visitorId), { timestamp: Date.now() });

        // Load Products
        onValue(ref(db, 'products'), s => { allProducts = s.val() || {}; renderProducts(); });

        function renderProducts() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            Object.entries(allProducts).forEach(([key, p]) => {
                if (currentCategory!== 'All' && p.category!== currentCategory) return;
                const card = document.createElement('div');
                card.className = 'product-card bg-white rounded-lg shadow-md overflow-hidden cursor-pointer';
                card.onclick = () => openProductModal(key, p);
                card.innerHTML = `<img src="${p.image}" class="w-full h-48 object-cover"><div class="p-3"><p class="font-semibold text-sm truncate">${p.name}</p><p class="text-lg font-bold text-blue-600">₹${p.price}</p>${p.featured? '<span class="text-xs bg-yellow-100 text-yellow-800 px-2 py-1 rounded">Featured</span>' : ''}<p class="text-xs text-gray-500 mt-1">⭐ ${p.rating || 0} | 👁️ ${p.views || 0}</p></div>`;
                grid.appendChild(card);
            });
        }

        window.filterCategory = (cat) => {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('bg-blue-600', 'text-white'));
            event.target.classList.add('bg-blue-600', 'text-white');
            renderProducts();
        };

        window.openProductModal = (key, p) => {
            currentProduct = {key,...p};
            document.getElementById('modal-name').textContent = p.name;
            document.getElementById('modal-img').src = p.image;
            document.getElementById('modal-desc').textContent = p.description;
            document.getElementById('modal-price').textContent = p.price;
            const sizesDiv = document.getElementById('modal-sizes');
            sizesDiv.innerHTML = '';
            p.sizes.forEach(s => {
                const btn = document.createElement('button');
                btn.className = 'size-btn border px-4 py-2 rounded-lg';
                btn.textContent = s;
                btn.onclick = () => { document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected')); btn.classList.add('selected'); };
                sizesDiv.appendChild(btn);
            });
            document.getElementById('product-modal').classList.add('active');
            update(ref(db, 'products/' + key), { views: (p.views || 0) + 1 });
        };

        window.closeModal = () => document.getElementById('product-modal').classList.remove('active');

        window.addToCartFromModal = () => {
            const size = document.querySelector('.size-btn.selected');
            if (!size) { alert('Please select a size'); return; }
            const existing = cart.find(i => i.key === currentProduct.key && i.size === size.textContent);
            if (existing) { existing.qty++; } else { cart.push({...currentProduct, size: size.textContent, qty: 1}); }
            updateCartCount();
            closeModal();
            alert('Added to cart!');
        };

        window.openCart = () => {
            renderCart();
            document.getElementById('cart-modal').classList.add('active');
        };

        window.closeCart = () => document.getElementById('cart-modal').classList.remove('active');

        function renderCart() {
            const itemsDiv = document.getElementById('cart-items');
            itemsDiv.innerHTML = '';
            let total = 0;
            cart.forEach((item, idx) => {
                total += item.price * item.qty;
                itemsDiv.innerHTML += `<div class="flex gap-3 border rounded-lg p-2"><img src="${item.image}" class="w-16 h-16 object-cover rounded"><div class="flex-1"><p class="font-semibold text-sm">${item.name}</p><p class="text-xs text-gray-600">Size: ${item.size} | ₹${item.price}</p><div class="flex items-center gap-2 mt-1"><button onclick="updateQty(${idx}, -1)" class="bg-gray-200 px-2 rounded">-</button><span class="text-sm">${item.qty}</span><button onclick="updateQty(${idx}, 1)" class="bg-gray-200 px-2 rounded">+</button><button onclick="removeFromCart(${idx})" class="text-red-600 text-xs ml-2">Remove</button></div></div></div>`;
            });
            document.getElementById('cart-total').textContent = total;
            document.getElementById('upi-amount').textContent = total;
        }

        window.updateQty = (idx, change) => { cart[idx].qty += change; if (cart[idx].qty <= 0) cart.splice(idx, 1); updateCartCount(); renderCart(); };
        window.removeFromCart = (idx) => { cart.splice(idx, 1); updateCartCount(); renderCart(); };
        function updateCartCount() { document.getElementById('cart-count').textContent = cart.reduce((sum, i) => sum + i.qty, 0); }

        window.openCheckout = () => {
            if (cart.length === 0) { alert('Cart is empty'); return; }
            closeCart();
            document.getElementById('checkout-modal').classList.add('active');
        };

        window.closeCheckout = () => document.getElementById('checkout-modal').classList.remove('active');

        window.toggleUPI = () => {
            const upiSection = document.getElementById('upi-section');
            const isUPI = document.querySelector('input[name="payment"]:checked').value === 'UPI';
            upiSection.classList.toggle('hidden',!isUPI);
            if (isUPI) {
                const total = cart.reduce((sum, i) => sum + i.price * i.qty, 0);
                document.getElementById('qrcode').innerHTML = '';
                new QRCode(document.getElementById('qrcode'), {
                    text: `upi://pay?pa=${UPI_ID}&pn=FashionFuel&am=${total}&cu=INR`,
                    width: 200,
                    height: 200
                });
            }
        };

        document.getElementById('checkout-form').onsubmit = async (e) => {
            e.preventDefault();
            const order = {
                name: document.getElementById('co-name').value,
                phone: document.getElementById('co-phone').value,
                address: document.getElementById('co-address').value,
                city: document.getElementById('co-city').value,
                pincode: document.getElementById('co-pincode').value,
                items: cart.map(i => ({name: i.name, price: i.price, size: i.size, qty: i.qty})),
                total: cart.reduce((sum, i) => sum + i.price * i.qty, 0),
                paymentMethod: document.querySelector('input[name="payment"]:checked').value,
                status: 'Pending',
                codVerified: false,
                timestamp: Date.now()
            };
            await push(ref(db, 'orders'), order);
            await set(ref(db, 'users/' + order.phone), {name: order.name, phone: order.phone, lastOrder: Date.now(), blocked: false});
            cart = [];
            updateCartCount();
            closeCheckout();
            alert('Order Placed Successfully! We will contact you soon.');
            const msg = `Hi, I placed an order. Name: ${order.name}, Phone: ${order.phone}, Total: ₹${order.total}`;
            window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`, '_blank');
        };

        document.getElementById('contact-form').onsubmit = async (e) => {
            e.preventDefault();
            const msg = {name: document.getElementById('c-name').value, email: document.getElementById('c-email').value, message: document.getElementById('c-message').value, timestamp: Date.now(), replied: false};
            await push(ref(db, 'messages'), msg);
            e.target.reset();
            alert('Message sent! We will reply soon.');
        };
    </script>
</body>
</html>
