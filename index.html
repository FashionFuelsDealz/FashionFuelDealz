<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion Fuel - Style That Speaks</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html { scroll-behavior: smooth; }
       .modal { display: none; }
       .modal.active { display: flex; }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Navbar -->
    <nav class="bg-white shadow-md sticky top-0 z-40">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-orange-600">Fashion Fuel</h1>
            <div class="flex items-center gap-6">
                <a href="#home" class="hover:text-orange-600">Home</a>
                <a href="#products" class="hover:text-orange-600">Shop</a>
                <a href="#contact" class="hover:text-orange-600">Contact</a>
                <button onclick="openCart()" class="relative">
                    <i class="fas fa-shopping-cart text-xl"></i>
                    <span id="cartCount" class="absolute -top-2 -right-2 bg-orange-600 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center">0</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section id="home" class="bg-gradient-to-r from-orange-500 to-pink-500 text-white py-20">
        <div class="container mx-auto px-4 text-center">
            <h2 class="text-5xl font-bold mb-4">Style That Speaks</h2>
            <p class="text-xl mb-6">Discover the latest trends in fashion</p>
            <a href="#products" class="bg-white text-orange-600 px-8 py-3 rounded-full font-bold hover:bg-gray-100">Shop Now</a>
        </div>
    </section>

    <!-- Products Section -->
    <section id="products" class="py-16">
        <div class="container mx-auto px-4">
            <h2 class="text-3xl font-bold text-center mb-10">Our Products</h2>
            <div id="productGrid" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
        </div>
    </section>

    <!-- Contact Section -->
    <section id="contact" class="py-16 bg-white">
        <div class="container mx-auto px-4 max-w-2xl">
            <h2 class="text-3xl font-bold text-center mb-10">Contact Us</h2>
            <div class="bg-gray-50 p-6 rounded-lg shadow">
                <input id="cName" placeholder="Your Name" class="w-full border p-3 mb-3 rounded">
                <input id="cEmail" placeholder="Your Email" type="email" class="w-full border p-3 mb-3 rounded">
                <textarea id="cMessage" placeholder="Your Message" rows="4" class="w-full border p-3 mb-3 rounded"></textarea>
                <button onclick="sendMessage()" class="w-full bg-orange-500 text-white py-3 rounded font-bold hover:bg-orange-600">Send Message</button>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white py-8 text-center">
        <p>&copy; 2026 Fashion Fuel. All rights reserved.</p>
    </footer>

    <!-- Product Detail Modal -->
    <div id="productModal" class="modal fixed inset-0 bg-black bg-opacity-50 z-50 items-center justify-center p-4">
        <div class="bg-white rounded-lg max-w-4xl w-full max-h-[90vh] overflow-y-auto">
            <div class="p-6">
                <div class="flex justify-between items-start mb-4">
                    <h3 id="modalName" class="text-2xl font-bold"></h3>
                    <button onclick="closeProductModal()" class="text-2xl">&times;</button>
                </div>
                <div class="grid md:grid-cols-2 gap-6">
                    <div>
                        <img id="modalMainImg" src="" class="w-full h-96 object-cover rounded mb-2">
                        <div id="modalThumbs" class="flex gap-2"></div>
                    </div>
                    <div>
                        <p id="modalPrice" class="text-3xl font-bold text-orange-600 mb-4"></p>
                        <p id="modalDesc" class="text-gray-600 mb-4"></p>
                        <div class="mb-4">
                            <label class="font-bold">Size:</label>
                            <select id="modalSize" class="w-full border p-2 rounded mt-1">
                                <option>S</option><option>M</option><option>L</option><option>XL</option><option>XXL</option>
                            </select>
                        </div>
                        <div class="mb-4">
                            <label class="font-bold">Colour:</label>
                            <select id="modalColour" class="w-full border p-2 rounded mt-1">
                                <option>Black</option><option>White</option><option>Red</option><option>Blue</option><option>Green</option>
                            </select>
                        </div>
                        <button onclick="addToCart()" class="w-full bg-orange-500 text-white py-3 rounded font-bold hover:bg-orange-600">Add to Cart</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Cart Modal -->
    <div id="cartModal" class="modal fixed inset-0 bg-black bg-opacity-50 z-50 items-center justify-center p-4">
        <div class="bg-white rounded-lg max-w-2xl w-full max-h-[90vh] overflow-y-auto">
            <div class="p-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-2xl font-bold">Your Cart</h3>
                    <button onclick="closeCart()" class="text-2xl">&times;</button>
                </div>
                <div id="cartItems" class="space-y-4 mb-4"></div>
                <div class="border-t pt-4">
                    <p class="text-xl font-bold mb-4">Total: ₹<span id="cartTotal">0</span></p>
                    <button onclick="openCheckout()" class="w-full bg-orange-500 text-white py-3 rounded font-bold hover:bg-orange-600">Checkout</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Checkout Modal -->
    <div id="checkoutModal" class="modal fixed inset-0 bg-black bg-opacity-50 z-50 items-center justify-center p-4">
        <div class="bg-white rounded-lg max-w-2xl w-full max-h-[90vh] overflow-y-auto">
            <div class="p-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-2xl font-bold">Checkout</h3>
                    <button onclick="closeCheckout()" class="text-2xl">&times;</button>
                </div>
                <input id="oName" placeholder="Full Name" class="w-full border p-3 mb-3 rounded">
                <input id="oPhone" placeholder="Mobile Number" type="tel" class="w-full border p-3 mb-3 rounded">
                <input id="oEmail" placeholder="Email" type="email" class="w-full border p-3 mb-3 rounded">
                <textarea id="oAddress" placeholder="Full Address" class="w-full border p-3 mb-3 rounded"></textarea>
                <input id="oLandmark" placeholder="Landmark" class="w-full border p-3 mb-3 rounded">
                <input id="oPincode" placeholder="Pincode" type="number" class="w-full border p-3 mb-3 rounded">
                <select id="oPayment" class="w-full border p-3 mb-4 rounded">
                    <option value="">Select Payment Method</option>
                    <option value="COD">Cash on Delivery</option>
                    <option value="UPI">UPI</option>
                    <option value="Card">Credit/Debit Card</option>
                </select>
                <button onclick="placeOrder()" class="w-full bg-orange-500 text-white py-3 rounded font-bold hover:bg-orange-600">Place Order</button>
            </div>
        </div>
    </div>

<script>
// Data
let products = JSON.parse(localStorage.getItem('products')) || [];
let cart = JSON.parse(localStorage.getItem('cart')) || [];
let orders = JSON.parse(localStorage.getItem('orders')) || [];
let messages = JSON.parse(localStorage.getItem('messages')) || [];
let currentProduct = null;

// Load Products
function loadProducts() {
    const grid = document.getElementById('productGrid');
    if(products.length === 0) {
        grid.innerHTML = '<p class="col-span-4 text-center text-gray-500 py-10">No products available yet. Check back soon!</p>';
        return;
    }
    let html = '';
    products.forEach(p => {
        html += `<div class="bg-white rounded-lg shadow hover:shadow-xl transition cursor-pointer" onclick="openProduct(${p.id})">
            <img src="${p.image}" class="h-64 w-full object-cover rounded-t-lg">
            <div class="p-4">
                <h3 class="font-bold mb-2">${p.name}</h3>
                <p class="text-orange-600 font-bold text-xl">₹${p.price}</p>
            </div>
        </div>`;
    });
    grid.innerHTML = html;
}

// Product Modal
function openProduct(id) {
    currentProduct = products.find(p => p.id === id);
    document.getElementById('modalName').innerText = currentProduct.name;
    document.getElementById('modalPrice').innerText = '₹' + currentProduct.price;
    document.getElementById('modalDesc').innerText = currentProduct.description;
    document.getElementById('modalMainImg').src = currentProduct.image;

    let thumbs = '';
    currentProduct.images.forEach(img => {
        thumbs += `<img src="${img}" onclick="document.getElementById('modalMainImg').src='${img}'" class="w-20 h-20 object-cover rounded cursor-pointer border-2 hover:border-orange-500">`;
    });
    document.getElementById('modalThumbs').innerHTML = thumbs;
    document.getElementById('productModal').classList.add('active');
}

function closeProductModal() {
    document.getElementById('productModal').classList.remove('active');
}

// Cart Functions
function addToCart() {
    const item = {
        id: currentProduct.id,
        name: currentProduct.name,
        price: currentProduct.price,
        image: currentProduct.image,
        size: document.getElementById('modalSize').value,
        colour: document.getElementById('modalColour').value,
        qty: 1
    };

    const existing = cart.find(c => c.id === item.id && c.size === item.size && c.colour === item.colour);
    if(existing) {
        existing.qty++;
    } else {
        cart.push(item);
    }

    localStorage.setItem('cart', JSON.stringify(cart));
    updateCartCount();
    closeProductModal();
    alert('Added to cart!');
}

function updateCartCount() {
    document.getElementById('cartCount').innerText = cart.reduce((sum, item) => sum + item.qty, 0);
}

function openCart() {
    loadCart();
    document.getElementById('cartModal').classList.add('active');
}

function closeCart() {
    document.getElementById('cartModal').classList.remove('active');
}

function loadCart() {
    const cartItems = document.getElementById('cartItems');
    if(cart.length === 0) {
        cartItems.innerHTML = '<p class="text-center text-gray-500 py-8">Your cart is empty</p>';
        document.getElementById('cartTotal').innerText = '0';
        return;
    }

    let html = '';
    let total = 0;
    cart.forEach((item, index) => {
        const itemTotal = item.price * item.qty;
        total += itemTotal;
        html += `<div class="flex gap-4 border-b pb-4">
            <img src="${item.image}" class="w-20 h-20 object-cover rounded">
            <div class="flex-1">
                <h4 class="font-bold">${item.name}</h4>
                <p class="text-sm text-gray-600">Size: ${item.size} | Colour: ${item.colour}</p>
                <p class="text-orange-600 font-bold">₹${item.price} x ${item.qty} = ₹${itemTotal}</p>
            </div>
            <button onclick="removeFromCart(${index})" class="text-red-500"><i class="fas fa-trash"></i></button>
        </div>`;
    });
    cartItems.innerHTML = html;
    document.getElementById('cartTotal').innerText = total;
}

function removeFromCart(index) {
    cart.splice(index, 1);
    localStorage.setItem('cart', JSON.stringify(cart));
    updateCartCount();
    loadCart();
}

// Checkout
function openCheckout() {
    if(cart.length === 0) {
        alert('Your cart is empty!');
        return;
    }
    closeCart();
    document.getElementById('checkoutModal').classList.add('active');
}

function closeCheckout() {
    document.getElementById('checkoutModal').classList.remove('active');
}

function placeOrder() {
    const order = {
        id: Date.now(),
        name: document.getElementById('oName').value,
        phone: document.getElementById('oPhone').value,
        email: document.getElementById('oEmail').value,
        address: document.getElementById('oAddress').value,
        landmark: document.getElementById('oLandmark').value,
        pincode: document.getElementById('oPincode').value,
        payment: document.getElementById('oPayment').value,
        items: cart,
        total: cart.reduce((sum, item) => sum + (item.price * item.qty), 0),
        date: new Date().toLocaleString(),
        size: cart[0].size,
        colour: cart[0].colour
    };

    if(!order.name ||!order.phone ||!order.email ||!order.address ||!order.pincode ||!order.payment) {
        alert('Please fill all fields');
        return;
    }

    orders.push(order);
    localStorage.setItem('orders', JSON.stringify(orders));
    cart = [];
    localStorage.setItem('cart', JSON.stringify(cart));
    updateCartCount();
    closeCheckout();
    alert('Order Placed Successfully! Thank you for shopping with Fashion Fuel.');
}

// Contact Form
function sendMessage() {
    const msg = {
        id: Date.now(),
        name: document.getElementById('cName').value,
        email: document.getElementById('cEmail').value,
        message: document.getElementById('cMessage').value,
        date: new Date().toLocaleString()
    };

    if(!msg.name ||!msg.email ||!msg.message) {
        alert('Please fill all fields');
        return;
    }

    messages.push(msg);
    localStorage.setItem('messages', JSON.stringify(messages));
    alert('Message sent! We will get back to you soon.');
    document.getElementById('cName').value = '';
    document.getElementById('cEmail').value = '';
    document.getElementById('cMessage').value = '';
}

// Init
loadProducts();
updateCartCount();
</script>
</body>
</html>
